server {
    listen 3000;
    client_max_body_size 50M;

    # pdf.js worker is an ES module; default nginx maps .mjs to octet-stream
    # which Chrome rejects for module workers → blank PDF preview.
    location ~* \.mjs$ {
        root /usr/share/nginx/html;
        default_type application/javascript;
        add_header Content-Type "application/javascript; charset=utf-8";
        try_files $uri =404;
    }

    # Serve React static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to FastAPI
    location /ingest {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # PDFs can be large, give it time
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    location /documents {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /ask {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # LLM can be slow locally; stream tokens without buffering
        proxy_read_timeout 180s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
